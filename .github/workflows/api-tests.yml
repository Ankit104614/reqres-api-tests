name: API Automation Regression Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman and HTML Reporter
        run: |
          npm install -g newman newman-reporter-htmlextra

      - name: Execute API Test Suite
        run: |
          newman run collection.json -e "postman/environments/QA Environment.environment.yaml" -r cli,htmlextra --reporter-htmlextra-export newman/report.html

      - name: Upload HTML Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always() # Ensures report is uploaded even if tests fail
        with:
          name: API-Test-Report
          path: newman/report.html